<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Futbol Libre - Live Sports Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #140e13;
      --bg-dark: #0e0a0d;
      --card-bg: transparent; /* Background removed as requested */
      --card-border-dashed: rgba(255, 255, 255, 0.2);
      --card-notch: #1c141a;
      --accent-red: #e12b4c;
      --accent-pink: #ff3b5c;
      --live-green: #22c55e;
      --text: #ffffff;
      --text-muted: #9e8e97;
      --text-dim: #6d6067;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #080608;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 8px;
    }

    /* Top Controls Bar for Desktop View */
    .top-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .toolbar-pill {
      background: #1c151a;
      border: 1px solid #32262e;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-weight: 600;
      transition: all 0.2s;
    }
    .toolbar-pill:hover {
      border-color: var(--accent-red);
    }

    /* Phone Device Simulator Frame */
    .device-container {
      width: 412px;
      max-width: 100%;
      height: 870px;
      max-height: 94vh;
      background: var(--bg);
      border: 9px solid #3d2f36;
      border-radius: 50px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .device-container.fullscreen-mode {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 100vh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: var(--bg);
      }
      .top-toolbar {
        display: none;
      }
      .device-container {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Phone Notch / Dynamic Island */
    .status-bar {
      height: 48px;
      padding: 12px 20px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      z-index: 50;
      background: var(--bg);
    }

    .island-pill {
      width: 100px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    /* Scrollable App Screen Content */
    .screen-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 12px 80px 12px;
      scrollbar-width: none;
    }
    .screen-scroll::-webkit-scrollbar { display: none; }

    /* Top App Header: Welcome Futbol Libre */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .brand-title-box {
      display: flex;
      flex-direction: column;
    }

    .app-welcome-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .app-brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #23191f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      color: #fff;
      font-size: 16px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #2d2027;
      transform: scale(1.05);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-pink);
      border-radius: 50%;
      position: absolute;
      top: 9px;
      right: 9px;
      box-shadow: 0 0 6px var(--accent-pink);
    }

    /* Horizontal Sports Selector (Pills) */
    .sports-row {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 0 4px 6px 4px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .sports-row::-webkit-scrollbar { display: none; }

    .sport-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #23191f;
      border: none;
      padding: 7px 16px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .sport-pill.active {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 4px 15px rgba(225, 43, 76, 0.4);
    }

    .sport-pill .sport-icon {
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Search Box: Smooth stationary focus (no shake/jump, clean luxury shadow) */
    .search-bar-box {
      width: 100%;
      background: #1c1419;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      /* Zero transform or margin shifts to prevent any shaking/jumping */
      transform: none !important;
    }

    .search-bar-box:focus-within {
      background: #22181f;
      border-color: rgba(255, 255, 255, 0.25);
      /* Clean luxury dark shadow without bright distracting colors */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.4);
      transform: none !important;
    }

    .search-svg-icon {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      flex-shrink: 0;
      transition: stroke 0.2s;
    }

    .search-bar-box:focus-within .search-svg-icon {
      stroke: #ffffff;
    }

    .search-bar-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-bar-box input::placeholder {
      color: var(--text-dim);
      font-size: 13px;
    }

    /* Matches List: Full Width */
    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Match Item Card: Background Transparent + Dashed Border + 8px Radius */
    .match-item-card {
      width: 100%;
      background: transparent; /* Background removed as requested */
      border: 1.5px dashed rgba(255, 255, 255, 0.18); /* Dashed border */
      border-radius: 8px; /* 8px radius */
      padding: 0 14px 14px 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .match-item-card:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    /* Top Notch Header: Time sits in a smooth recessed tab */
    .card-top-notch-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .card-top-notch {
      background: var(--card-notch);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: none;
      padding: 4px 16px;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .match-card-main-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    /* Left Team: Logo + Single line name with ellipsis */
    .team-left-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0; /* Prevents push overflow */
    }

    .team-badge-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      flex-shrink: 0;
    }

    .team-text-block {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .team-name-text {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* e.g. Paris Saint-... */
      display: block;
    }

    .team-sub-role {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Center VS badge */
    .center-vs-box {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .center-vs-text {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* Right Team: Single line name with ellipsis on left, Logo on far right */
    .team-right-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      text-align: right;
      min-width: 0; /* Prevents push overflow */
    }

    .team-right-box .team-text-block {
      align-items: flex-end;
    }

    /* Live Stream Slide-up Modal */
    .stream-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      flex-direction: column;
      backdrop-filter: blur(12px);
    }

    .stream-modal.show {
      display: flex;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #33272e;
      background: #1c141a;
    }

    .modal-match-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-close-btn {
      background: #33272e;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .video-wrapper {
      width: 100%;
      height: 250px;
      background: #000;
      position: relative;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-details {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-btn {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .modal-btn.secondary {
      background: #2b2027;
      border: 1px solid #33272e;
      color: var(--text-muted);
    }

    .loading-pulse {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Top toolbar for desktop simulator view -->
  <div class="top-toolbar">
    <div class="toolbar-pill" onclick="toggleFullscreenView()">
      <span id="viewModeIcon">📱</span> <span id="viewModeText">Phone Frame Mode</span>
    </div>
    <div class="toolbar-pill" onclick="fetchLiveSchedule()">
      <span>🔄</span> Refresh API
    </div>
  </div>

  <!-- Mobile Screen Container -->
  <div class="device-container" id="deviceContainer">
    <!-- Status Bar & Dynamic Island -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="island-pill"></div>
      <div class="status-icons">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="screen-scroll">
      
      <!-- Top App Header: Welcome Futbol Libre -->
      <div class="app-header">
        <div class="brand-title-box">
          <div class="app-welcome-sub">Welcome</div>
          <div class="app-brand-title">Futbol Libre</div>
        </div>
        <div class="header-actions">
          <div class="icon-btn" title="Messages">
            💬
          </div>
          <div class="icon-btn" title="Notifications">
            🔔
            <div class="badge-dot"></div>
          </div>
        </div>
      </div>

      <!-- Sports Category Pills -->
      <div class="sports-row" id="sportsSelector">
        <div class="sport-pill active" onclick="filterSport('ALL')">
          <span class="sport-icon">🏆</span>
          <span>All Sports</span>
        </div>
      </div>

      <!-- Search Box with clean stationary shadow (no jump/shake) -->
      <div class="search-bar-box">
        <svg class="search-svg-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search teams, leagues, sports..." oninput="handleSearch(this.value)">
      </div>

      <!-- Match Cards List (Background Transparent + Dashed Border + 8px Radius) -->
      <div class="matches-list" id="matchesListContainer">
        <div class="loading-pulse">Connecting to live API schedule...</div>
      </div>

    </div>

    <!-- Live Stream Modal / Player Drawer -->
    <div class="stream-modal" id="streamModal">
      <div class="modal-nav">
        <div class="modal-match-title" id="modalTitle">Live Broadcast</div>
        <button class="modal-close-btn" onclick="closeStreamModal()">✕</button>
      </div>
      <div class="video-wrapper">
        <iframe id="streamIframe" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
      <div class="modal-details">
        <div style="background: #1c141a; padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
          <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;" id="modalMatchTeams">Match Stream</div>
          <div style="font-size: 12px; color: var(--text-muted);" id="modalMatchInfo">Live Streaming</div>
        </div>
        <button class="modal-btn" onclick="reloadStreamIframe()">
          🔄 Reload Video Stream
        </button>
        <button class="modal-btn secondary" onclick="openExternalStream()">
          🌐 Open In External Window
        </button>
      </div>
    </div>
  </div>

  <script>
    let allMatches = [];
    let currentSelectedSport = 'ALL';
    let availableSports = ['ALL'];
    let searchQuery = '';
    let activeStreamUrl = '';

    async function fetchLiveSchedule() {
      try {
        let rawData = null;

        try {
          const res = await fetch('/api/schedule');
          if (res.ok) {
            rawData = await res.json();
          }
        } catch (e) {
          console.warn('Proxy fetch failed, trying direct...', e);
        }

        if (!rawData) {
          const res = await fetch('https://gamez.quest/api/v1/schedule/all');
          rawData = await res.json();
        }

        allMatches = Array.isArray(rawData) ? rawData : (rawData.value || []);
        console.log('Loaded matches:', allMatches.length);

        renderSportsPills();
        renderMatchCards();
      } catch (e) {
        console.error('API Error:', e);
        document.getElementById('matchesListContainer').innerHTML = `
          <div style="text-align: center; padding: 24px; color: var(--text-muted);">
            <div>⚠️ Live API Connection Failed</div>
            <button class="modal-btn" style="margin: 12px auto; padding: 6px 14px; font-size: 12px;" onclick="fetchLiveSchedule()">Retry</button>
          </div>
        `;
      }
    }

    function renderSportsPills() {
      const sports = new Set();
      allMatches.forEach(m => {
        if (m.Sport) sports.add(m.Sport.toUpperCase());
      });

      availableSports = ['ALL', ...Array.from(sports)];
      const icons = {
        'ALL': '🏆',
        'LALIGA': '⚽',
        'FRENCH-LIGUE-1': '⚽',
        'BUNDESLIGA': '⚽',
        'BRAZIL-SERIE-A': '⚽',
        'NBA': '🏀',
        'NHL': '🏒',
        'CFB': '🏈',
        'MOTORSPORTS': '🏎️'
      };

      const container = document.getElementById('sportsSelector');
      container.innerHTML = availableSports.map(s => {
        const icon = icons[s] || '⚡';
        const isSelected = s === currentSelectedSport;
        const name = s === 'ALL' ? 'All Sports' : s.replace(/-/g, ' ');

        return `
          <div class="sport-pill ${isSelected ? 'active' : ''}" onclick="filterSport('${s}')">
            <span class="sport-icon">${icon}</span>
            <span>${name}</span>
          </div>
        `;
      }).join('');
    }

    function filterSport(sport) {
      currentSelectedSport = sport;
      renderSportsPills();
      renderMatchCards();
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderMatchCards();
    }

    function renderMatchCards() {
      let list = allMatches;

      // Filter by Sport
      if (currentSelectedSport !== 'ALL') {
        list = list.filter(m => m.Sport && m.Sport.toUpperCase() === currentSelectedSport);
      }

      // Filter by search query
      if (searchQuery) {
        list = list.filter(m => {
          return (m.Team1 && m.Team1.toLowerCase().includes(searchQuery)) ||
                 (m.Team2 && m.Team2.toLowerCase().includes(searchQuery)) ||
                 (m.League && m.League.toLowerCase().includes(searchQuery)) ||
                 (m.Sport && m.Sport.toLowerCase().includes(searchQuery));
        });
      }

      const container = document.getElementById('matchesListContainer');

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px;">
            No matches found.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(m => {
        const team1Logo = m.Team1Logo || 'https://falconembeds.lol/falconembeds-default-live-games.png';
        const team2Logo = m.Team2Logo || 'https://falconembeds.lol/falconembeds-default-live-games.png';
        const titleSafe = `${m.Team1} vs ${m.Team2}`.replace(/'/g, "\\'");
        const timeDisplay = m.Time || 'LIVE';

        return `
          <div class="match-item-card" onclick="openStreamModal('${m.IframeURL}', '${titleSafe}', '${m.League}', '${m.Time}')">
            
            <!-- Top Center Recessed Notch with Time -->
            <div class="card-top-notch-wrap">
              <div class="card-top-notch">${timeDisplay}</div>
            </div>
            
            <div class="match-card-main-content">
              <!-- Left Team: Logo + Single line name with ellipsis -->
              <div class="team-left-box">
                <img class="team-badge-logo" src="${team1Logo}" alt="${m.Team1}" onerror="this.src='https://falconembeds.lol/falconembeds-default-live-games.png'">
                <div class="team-text-block">
                  <div class="team-name-text" title="${m.Team1}">${m.Team1}</div>
                  <div class="team-sub-role">Home</div>
                </div>
              </div>

              <!-- Center VS -->
              <div class="center-vs-box">
                <div class="center-vs-text">VS</div>
              </div>

              <!-- Right Team: Single line name with ellipsis + Logo -->
              <div class="team-right-box">
                <div class="team-text-block">
                  <div class="team-name-text" title="${m.Team2}">${m.Team2}</div>
                  <div class="team-sub-role">Away</div>
                </div>
                <img class="team-badge-logo" src="${team2Logo}" alt="${m.Team2}" onerror="this.src='https://falconembeds.lol/falconembeds-default-live-games.png'">
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openStreamModal(url, title, league, time) {
      activeStreamUrl = url;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMatchTeams').innerText = title;
      document.getElementById('modalMatchInfo').innerText = `${league || 'Live Match'} • ${time || 'LIVE'} Broadcast`;
      document.getElementById('streamIframe').src = url;
      document.getElementById('streamModal').classList.add('show');
    }

    function closeStreamModal() {
      document.getElementById('streamModal').classList.remove('show');
      document.getElementById('streamIframe').src = '';
    }

    function reloadStreamIframe() {
      document.getElementById('streamIframe').src = activeStreamUrl;
    }

    function openExternalStream() {
      if (activeStreamUrl) {
        window.open(activeStreamUrl, '_blank');
      }
    }

    function toggleFullscreenView() {
      const container = document.getElementById('deviceContainer');
      const isFull = container.classList.toggle('fullscreen-mode');
      document.getElementById('viewModeText').innerText = isFull ? 'Fullscreen Mobile Mode' : 'Phone Frame Mode';
    }

    // Auto-refresh API every 60 seconds
    setInterval(fetchLiveSchedule, 60000);

    // Initial load
    fetchLiveSchedule();
  </script>
</body>
</html>
