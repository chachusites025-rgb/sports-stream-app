name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android Platform Wrappers
        run: |
          flutter create --org com.gamezquest --project-name sports_stream_app .
          # Ensure Android permissions in AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          fi
          # Ensure cleartext traffic and hardware acceleration
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/SportsStream-v1.0.apk
          ls -la output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsStream-release-apk
          path: output/SportsStream-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Sports Stream App v1.0.0"
          body: |
            ## 🏆 Sports Stream App v1.0.0 (Release)
            
            Download the APK directly to your Android device to install and enjoy live sports streaming!
            
            ### Features:
            - 📡 Live match schedule powered by `gamez.quest` API.
            - ⚽ All sports: Football (LaLiga, Ligue 1, Bundesliga, Serie A), Basketball (NBA), F1 Racing, Ice Hockey (NHL), College Football (CFB).
            - 📺 Embedded Web Streaming Player with fullscreen mode & pop-up protection.
            - 🔄 Auto-refreshing matches & pull-to-refresh.
            - 🔎 Real-time search by team or league.
          files: output/SportsStream-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
