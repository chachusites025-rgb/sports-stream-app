name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Clean Android Platform
        run: |
          flutter create --org com.gamezquest --project-name sports_stream_app .
          rm -rf test/
          # Set Android permissions and configurations
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/SportsStream-v1.0.apk
          ls -lh output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsStream-release-apk
          path: output/SportsStream-v1.0.apk
          retention-days: 30

      - name: Publish Release with APK
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 output/SportsStream-v1.0.apk \
            --title "🏆 Sports Stream App v1.0.0" \
            --notes "Live sports streaming mobile app powered by Gamez Quest API. Download and install SportsStream-v1.0.apk directly on Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
